services:
  postgres:
    image: postgres:16
    container_name: your_container_name
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_passwd
      POSTGRES_DB: db_name
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: